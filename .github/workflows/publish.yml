name: Publish verified installer artifacts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful installer build run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.run_id }}
    steps:
      - name: Verify build provenance and download artifacts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('run.json'))
          assert r['conclusion']=='success', 'Build must succeed before publication'
          assert r['path']=='.github/workflows/installers.yml', 'Unexpected workflow'
          assert r['head_repository']['full_name']==os.environ['GH_REPO'], 'Unexpected repository'
          assert r['head_branch']=='main', 'Build must come from main'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('BUILD_SHA='+r['head_sha']+'\n')
          PY
          gh run download "$BUILD_RUN" --dir installers
      - name: Check every platform and checksum
        shell: bash
        run: |
          set -euo pipefail
          for platform in macos-x86_64 macos-aarch64 windows-x86_64 windows-aarch64 linux-x86_64 linux-aarch64; do
            test -d "installers/irajeev-$platform"
            (cd "installers/irajeev-$platform" && sha256sum -c SHA256SUMS.txt)
          done
          find installers -name SHA256SUMS.txt -exec cat {} + > SHA256SUMS.txt
      - name: Publish experimental release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find installers -type f ! -name SHA256SUMS.txt | sort)
          gh release create v0.8.0-irajeev.1 --target "$BUILD_SHA" --prerelease \
            --title "DesignCraft INDD patch 0.8.0 — iRajeev" \
            --notes "Independent experimental build with direct INDD/INDT import. Install alongside the original DesignCraft app. Review fonts, images and layout after import; save edits as DesignCraft or IDML. Unsigned installers: macOS builds are ad-hoc signed, not notarized. See the README for installation instructions and limitations. Six native build targets passed the importer regression tests before packaging." \
            SHA256SUMS.txt "${assets[@]}"
