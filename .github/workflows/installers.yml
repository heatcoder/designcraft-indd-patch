name: Build iRajeev installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15-intel, name: macos-x86_64}
          - {os: macos-15, name: macos-aarch64}
          - {os: windows-2025, name: windows-x86_64}
          - {os: windows-11-arm, name: windows-aarch64}
          - {os: ubuntu-22.04, name: linux-x86_64}
          - {os: ubuntu-22.04-arm, name: linux-aarch64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust 1.95
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev libvulkan-dev pkg-config
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup --yes --no-progress }
      - name: Prepare pinned source
        run: python scripts/prepare.py
      - name: Build desktop and CLI
        working-directory: build/designcraft
        run: cargo build --release --locked -p designcraft -p designcraft-cli
      - name: INDD routing regression tests
        working-directory: build/designcraft
        run: cargo test --release --locked -p designcraft-engine indd
      - name: Missing image preview regression test
        working-directory: build/designcraft
        run: cargo test --release --locked -p designcraft-idml missing_linked_graphics_show_their_preview_and_keep_their_link
      - name: Package installer
        run: python scripts/package.py --source build/designcraft --bin-dir build/designcraft/target/release
      - uses: actions/upload-artifact@v4
        with:
          name: irajeev-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: irajeev-*
      - name: Publish prerelease with all successful builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find installers -name SHA256SUMS.txt -exec cat {} + > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --prerelease --title "irajeev.com — DesignCraft INDD patch $GITHUB_REF_NAME" --notes "Experimental independent patch. Review fonts, images and layout after importing. Unsigned installers; see repository installation instructions." SHA256SUMS.txt $(find installers -type f ! -name SHA256SUMS.txt)
