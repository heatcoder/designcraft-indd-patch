name: Build Heatcoder installers
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Build all platforms or retry Windows only
        type: choice
        default: all
        options: [all, windows]
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.platforms == 'windows' && '[{"os": "windows-2025", "name": "windows-x86_64"}, {"os": "windows-11-arm", "name": "windows-aarch64"}]' || '[{"os": "macos-15-intel", "name": "macos-x86_64"}, {"os": "macos-15", "name": "macos-aarch64"}, {"os": "windows-2025", "name": "windows-x86_64"}, {"os": "windows-11-arm", "name": "windows-aarch64"}, {"os": "ubuntu-22.04", "name": "linux-x86_64"}, {"os": "ubuntu-22.04-arm", "name": "linux-aarch64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CRAFT_FONTS_DIR: ${{ github.workspace }}/fonts
      CRAFT_FONTS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust 1.95
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libudev-dev libasound2-dev libvulkan-dev pkg-config
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup --yes --no-progress }
      - name: Prepare pinned source
        run: python scripts/prepare.py
      - name: Build desktop and CLI
        working-directory: build/designcraft
        run: cargo build --release --locked -p designcraft -p designcraft-cli
      - name: Legacy Malayalam FML regression tests
        working-directory: build/designcraft
        run: |
          cargo test --release --locked -p designcraft-fonts legacy_fml
          cargo test --release --locked -p designcraft-fonts malayalam
      - name: Malayalam input and undo regression tests
        working-directory: build/designcraft
        run: cargo test --release --locked -p designcraft-engine malayalam
      - name: Direct page input regression tests
        working-directory: build/designcraft
        run: cargo test --release --locked -p designcraft-ui-egui direct_malayalam
      - name: Translation catalog regression tests
        working-directory: build/designcraft
        run: cargo test --release --locked -p designcraft-ui-egui i18n::tests
      - name: INDD routing regression tests
        working-directory: build/designcraft
        run: cargo test --release --locked -p designcraft-engine indd
      - name: Missing image preview regression test
        working-directory: build/designcraft
        run: cargo test --release --locked -p designcraft-idml missing_linked_graphics_show_their_preview_and_keep_their_link
      - name: Quit recovery regression tests
        working-directory: build/designcraft
        run: cargo test --release --locked -p designcraft exit_recovery
      - name: Package installer
        run: python scripts/package.py --source build/designcraft --bin-dir build/designcraft/target/release
      - name: Extract and verify installer payload
        run: python scripts/verify_package.py --source build/designcraft
      - name: Test extracted application
        shell: python
        run: |
          import json, pathlib, subprocess
          report = next(pathlib.Path("dist").glob("verification-*.json"))
          cli = json.loads(report.read_text())["cli"]
          subprocess.run(["python", "scripts/smoke_packaged.py", "--cli", cli, "--work", "build/packaged-smoke"], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: heatcoder-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
  release:
    # Distribution audit remains open. Build artifacts are for review, not public releases.
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: heatcoder-*
      - name: Publish prerelease with all successful builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find installers -name SHA256SUMS.txt -exec cat {} + > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --prerelease --title "Heatcoder — DesignCraft INDD patch $GITHUB_REF_NAME" --notes "Experimental independent patch. Review fonts, images and layout after importing. Unsigned installers; see repository installation instructions." SHA256SUMS.txt $(find installers -type f ! -name SHA256SUMS.txt)
